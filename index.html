<title>WaterPrint — брендована вода</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#0d0f12;color:#111}
button,input,select{font:inherit}
a{text-decoration:none;color:inherit}
.container{width:min(1120px,calc(100% - 30px));margin:auto}
.header{position:sticky;top:0;z-index:50;background:#17191c;color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.nav{height:68px;display:flex;align-items:center;justify-content:space-between}
.logo{font-weight:800;font-size:18px}.logo span{color:#1698ff}
.menu{display:flex;gap:24px;font-size:14px}.menu a:hover{color:#52b8ff}
.burger{display:none;background:none;border:0;color:#fff;font-size:28px;cursor:pointer}

.hero{background:linear-gradient(100deg,#050607,#090c10 58%,#071b2b);color:#fff}
.heroGrid{display:grid;grid-template-columns:1.08fr .92fr;gap:40px;align-items:center;min-height:520px;padding:55px 0}
.badge{display:inline-block;color:#56baff;background:rgba(21,152,255,.11);padding:7px 10px;border-radius:999px;font-size:11px;font-weight:800}
h1{margin:15px 0 16px;font-size:clamp(41px,6vw,68px);line-height:.97;letter-spacing:-.045em}
h1 span{color:#1698ff}
.lead{color:#b2bac4;line-height:1.6;max-width:550px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0}
.btn{padding:13px 18px;border-radius:999px;border:0;font-weight:800;cursor:pointer;transition:.18s}
.primary{background:#1698ff;color:#fff;box-shadow:0 10px 28px rgba(22,152,255,.27)}
.primary:hover{transform:translateY(-1px)}
.ghost{background:transparent;color:#fff;border:1px solid #6c737b}.ghost:hover{background:#fff;color:#111}
.stats{display:flex;gap:30px;flex-wrap:wrap}.stat b{display:block;font-size:20px}.stat small{color:#8f98a3;font-size:11px}
.heroImg,.bottle{display:block;width:100%;border-radius:20px}
.heroImg{box-shadow:0 25px 70px rgba(0,0,0,.46)}

.section{padding:78px 0}.white{background:#fff}.light{background:#f4f7fb}
.head{max-width:760px;margin:0 auto 40px;text-align:center}.head h2{margin:8px 0 12px;font-size:clamp(31px,4vw,45px);letter-spacing:-.035em}.head p{color:#747e89;line-height:1.6}
.eyebrow{color:#1698ff;font-size:11px;font-weight:800;letter-spacing:.13em}

.features,.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:#fff;border:1px solid #e7ecf1;border-radius:17px;padding:19px;box-shadow:0 8px 25px rgba(18,34,50,.05)}
.icon{width:40px;height:40px;background:#eaf5ff;color:#1594ef;border-radius:11px;display:grid;place-items:center;font-weight:900;margin-bottom:13px}
.card h3{margin:0 0 7px;font-size:15px}.card p,.step p{margin:0;color:#78828d;font-size:13px;line-height:1.55}
.num{width:34px;height:34px;display:grid;place-items:center;background:#1698ff;color:#fff;border-radius:50%;font-size:11px;font-weight:800;margin-bottom:15px}.step h3{margin:0 0 7px;font-size:15px}

.orderGrid{display:grid;grid-template-columns:1.02fr .98fr;gap:44px;align-items:center}
.orderBox{background:#fff;border:1px solid #e5eaef;border-radius:20px;padding:24px;box-shadow:0 12px 40px rgba(15,32,49,.08)}
.orderBox h3{font-size:25px;margin:0 0 4px}.sub{margin:0 0 18px;color:#78818c;font-size:13px}
.field{margin:14px 0}.field label{display:block;margin-bottom:7px;color:#313842;font-size:12px;font-weight:800}
select,.qtyInput,.formInput{width:100%;height:44px;border:1px solid #dfe5ea;border-radius:11px;background:#fbfcfd;padding:0 11px;outline:none}
select:focus,.qtyInput:focus,.formInput:focus{border-color:#1698ff}
.qtyRow{display:grid;grid-template-columns:44px 1fr 44px;gap:9px}.qtyRow button{height:44px;border:1px solid #dfe5ea;background:#fff;border-radius:11px;cursor:pointer;font-size:20px}
.total{display:flex;justify-content:space-between;align-items:center;background:#eef8ff;padding:12px 13px;border-radius:12px;margin:18px 0;font-weight:800}.total strong{color:#1592ee;font-size:23px}

.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}
.galleryCard{background:#fff;border:1px solid #e6ebef;border-radius:17px;overflow:hidden;transition:.18s}.galleryCard:hover{transform:translateY(-2px)}
.galleryCard img{display:block;width:100%;height:210px;object-fit:cover;background:#dfe8ef}.galleryCard div{padding:12px 14px}.galleryCard b{font-size:13px}.galleryCard small{display:block;color:#8b949d;font-size:11px;margin-top:4px}

.cta{background:#04070b;color:#fff;padding:84px 0;text-align:center}
.cta h2{max-width:820px;margin:0 auto 15px;font-size:clamp(34px,5vw,53px);line-height:1.04}.cta p{max-width:770px;margin:0 auto;color:#a7afb9;line-height:1.6}
.pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:22px 0}.pill{border:1px solid rgba(255,255,255,.15);padding:7px 11px;border-radius:999px;color:#cbd1d8;font-size:11px}

.footer{background:#050609;color:#fff;padding:42px 0 18px}.footerGrid{display:grid;grid-template-columns:1fr auto;gap:70px}.footerBrandLogo{display:flex;align-items:center;gap:10px}.footerWater{font-size:22px;font-weight:900;letter-spacing:-.04em}.footerWater span{color:#1698ff}.contactList{display:flex;flex-direction:column;gap:6px;margin-top:17px;color:#9099a4;font-size:12px}.contactList a:hover{color:#fff}.socials{display:flex;gap:8px;margin-top:18px}.socials a{width:32px;height:32px;border:1px solid rgba(255,255,255,.14);border-radius:50%;display:grid;place-items:center;color:#dce1e6;font-weight:800}.socials a:hover{border-color:#1698ff;color:#1698ff}.footerLinks{display:grid;grid-template-columns:repeat(2,120px);gap:9px 18px;color:#9099a4;font-size:12px}.footerLinks a:hover{color:#fff}.copy{border-top:1px solid rgba(255,255,255,.08);margin-top:30px;padding-top:13px;color:#6f7882;font-size:10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;align-items:center;justify-content:center;padding:18px}
.modal.show{display:flex}.modalBox{width:min(620px,100%);background:#fff;border-radius:21px;padding:24px;position:relative;max-height:92vh;overflow:auto}
.close{position:absolute;right:12px;top:12px;width:35px;height:35px;border:0;border-radius:50%;background:#f0f2f4;cursor:pointer}
.modalBox h3{margin:0 35px 5px 0;font-size:25px}.modalSub{margin:0 0 17px;color:#78818d;font-size:13px;line-height:1.5}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formField.full{grid-column:1/-1}
.payment{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.payOption{border:1px solid #dfe5ea;border-radius:11px;padding:11px;cursor:pointer;background:#fff;font-size:12px;font-weight:700}.payOption input{display:none}.payOption.active{border-color:#1698ff;background:#eef8ff;color:#0e83da}
.formNote{font-size:11px;color:#7c8691;line-height:1.45;margin:10px 0}
.success{padding:18px;border-radius:15px;background:#effbf3;border:1px solid #bde9c9;color:#1f6e35;font-size:13px;line-height:1.55;display:none}
.error{padding:12px;border-radius:12px;background:#fff0f0;border:1px solid #f1baba;color:#9e3030;font-size:12px;display:none;margin-top:10px}

@media(max-width:850px){
 .menu{display:none}.burger{display:block}
 .heroGrid,.orderGrid{grid-template-columns:1fr}.heroVisual{order:-1}
 .features,.steps{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
 .container{width:calc(100% - 24px)}
 .features,.steps,.gallery,.formGrid{grid-template-columns:1fr}
 .formField.full{grid-column:auto}
 .payment{grid-template-columns:1fr}
 h1{font-size:42px}
 .actions{width:100%;gap:10px}
 .actions .btn{width:100%;min-height:50px;font-size:15px}
 .cta{padding:64px 0}
 .cta #partnerBtn{display:block;width:100%;min-height:52px;padding:15px 20px;font-size:16px}
 .footerGrid{grid-template-columns:1fr}.footerLinks{grid-template-columns:repeat(2,1fr)}
 .modal{padding:8px}.modalBox{padding:20px 14px;border-radius:18px;max-height:96vh}
 .modalBox h3{font-size:23px}
 .formInput{height:46px}
}
</style>
</head>
<body>

<header class="header">
 <div class="container nav">
  <div class="logo" id="logo"></div>
  <nav class="menu" id="mainMenu">
   <a href="#" onclick="event.preventDefault();goToSection('about')" id="navAbout"></a>
   <a href="#" onclick="event.preventDefault();goToSection('process')" id="navProcess"></a>
   <a href="#" onclick="event.preventDefault();openPortfolioDrive()" id="navPortfolio"></a>
   <a href="#" onclick="event.preventDefault();goToSection('order')" id="navOrder"></a>
  </nav>
  <button class="burger" id="burger">☰</button>
 </div>
</header>

<section class="hero">
 <div class="container heroGrid">
  <div>
   <div class="badge" id="heroBadge"></div>
   <h1 id="heroTitle"></h1>
   <p class="lead" id="heroText"></p>
   <div class="actions">
    <button class="btn primary" id="heroOrderBtn"></button>
    <button class="btn ghost" id="heroMoreBtn"></button>
   </div>
   <div class="stats">
    <div class="stat"><b id="stat1Value"></b><small id="stat1Text"></small></div>
    <div class="stat"><b id="stat2Value"></b><small id="stat2Text"></small></div>
    <div class="stat"><b id="stat3Value"></b><small id="stat3Text"></small></div>
   </div>
  </div>
  <div class="heroVisual"><img class="heroImg" id="heroImage" alt=""></div>
 </div>
</section>

<section id="about" class="section white">
 <div class="container">
  <div class="head"><div class="eyebrow" id="aboutEyebrow"></div><h2 id="aboutTitle"></h2><p id="aboutText"></p></div>
  <div class="features" id="features"></div>
 </div>
</section>

<section id="process" class="section light">
 <div class="container">
  <div class="head"><h2 id="processTitle"></h2><p id="processText"></p></div>
  <div class="steps" id="steps"></div>
 </div>
</section>

<section id="order" class="section white">
 <div class="container orderGrid">
  <div><img class="bottle" id="bottleImage" alt=""></div>
  <div class="orderBox">
   <h3 id="calcTitle"></h3>
   <p class="sub" id="calcSub"></p>

   <div class="field"><label id="waterLabel"></label><select id="water"></select></div>
   <div class="field"><label id="labelLabel"></label><select id="labelType"></select></div>
   <div class="field"><label id="countLabel"></label>
    <div class="qtyRow"><button type="button" id="minus">−</button><input class="qtyInput" id="count" type="number" min="100" step="100" value="500"><button type="button" id="plus">+</button></div>
   </div>
   <div class="total"><span id="totalText"></span><strong id="price"></strong></div>
   <button class="btn primary" style="width:100%" id="orderBtn"></button>
  </div>
 </div>
</section>

<section id="portfolio" class="section light">
 <div class="container">
  <div class="head" style="text-align:left;margin-left:0">
    <div class="eyebrow">PORTFOLIO</div>
    <h2 id="portfolioTitle"></h2>
    <p id="portfolioText"></p>
    <button class="btn primary" type="button" onclick="openPortfolioDrive()" style="margin-top:8px" id="portfolioDriveBtn"></button>
  </div>
  <div class="gallery" id="gallery"></div>
 </div>
</section>

<section class="cta">
 <div class="container">
  <h2 id="ctaTitle"></h2>
  <p id="ctaText"></p>
  <div class="pills" id="pills"></div>
  <button class="btn primary" id="partnerBtn"></button>
 </div>
</section>

<footer class="footer">
 <div class="container">
  <div class="footerGrid">
   <div class="footerBrand">
    <div class="footerBrandLogo">
      <span class="dropLogo" aria-hidden="true">

          <path d="M18 8C18 8 11 16.4 11 22.5c0 4.6 2.8 7.7 7 8.4-3.2-2.1-4.6-4.7-4.6-8.1C13.4 18.8 18 8 18 8Z" fill="#fff" opacity=".9"/>
        </svg>
      </span>
      <span class="footerWater">Water<span>Print</span></span>
    </div>
    <div class="contactList">
      <a id="footerPhone" href="tel:+380675086876"></a>
      <a id="footerEmail" href="mailto:info@waterprint.ua"></a>
      <span id="footerCity"></span>
      <span id="footerHours"></span>
    </div>
    <div class="socials">

   </div>
   <div>

    <div class="footerLinks" style="margin-top:12px">
      <a href="#" onclick="event.preventDefault();goToSection('about')" id="fAbout"></a>
      <a href="#" onclick="event.preventDefault();goToSection('process')" id="fProcess"></a>
      <a href="#" onclick="event.preventDefault();openPortfolioDrive()" id="fPortfolio"></a>
      <a href="#" onclick="event.preventDefault();goToSection('order')" id="fOrder"></a>
    </div>
   </div>
  </div>
  <div class="copy"><span id="copyright"></span><span id="rights"></span></div>
 </div>
</footer>

<div class="modal" id="orderModal">
 <div class="modalBox">
  <button class="close" type="button" onclick="closeModal('orderModal')">✕</button>
  <h3 id="orderFormTitle"></h3>
  <p class="modalSub" id="orderFormSub"></p>
  <form id="orderForm">
   <input type="hidden" name="form_type" value="order">
   <div class="formGrid">
    <div class="formField"><label id="nameLabel"></label><input class="formInput" name="name" id="name" required></div>
    <div class="formField"><label id="phoneLabel"></label><input class="formInput" name="phone" id="phone" required></div>
    <div class="formField full"><label id="emailLabel"></label><input class="formInput" type="email" name="email" id="email" required></div>
    <div class="formField"><label id="cityLabel"></label><input class="formInput" name="city" id="city"></div>
    <div class="formField"><label id="quantityLabel"></label><input class="formInput" name="quantity" id="formQuantity" readonly></div>
    <div class="formField full">
     <label id="paymentLabel"></label>
     <div class="payment" id="paymentOptions"></div>
     <input type="hidden" name="payment" id="payment">
    </div>
    <input type="hidden" name="water" id="formWater">
    <input type="hidden" name="label_type" id="formLabel">
    <input type="hidden" name="total" id="formTotal">
   </div>
   <div class="formNote" id="paymentNote"></div>
   <button class="btn primary" style="width:100%" type="submit" id="submitOrder"></button>
   <div class="success" id="orderSuccess"></div>
   <div class="error" id="orderError"></div>
  </form>
 </div>
</div>

<div class="modal" id="partnerModal">
 <div class="modalBox">
  <button class="close" type="button" onclick="closeModal('partnerModal')">✕</button>
  <h3 id="partnerFormTitle"></h3>
  <p class="modalSub" id="partnerFormSub"></p>
  <form id="partnerForm">
   <input type="hidden" name="form_type" value="partner">
   <div class="formGrid">
    <div class="formField"><label id="pNameLabel"></label><input class="formInput" name="name" required></div>
    <div class="formField"><label id="pPhoneLabel"></label><input class="formInput" name="phone" required></div>
    <div class="formField full"><label id="pEmailLabel"></label><input class="formInput" type="email" name="email" required></div>
    <div class="formField full"><label id="pCompanyLabel"></label><input class="formInput" name="company"></div>
    <div class="formField full"><label id="pMessageLabel"></label><textarea class="formInput" name="message" rows="4" style="height:auto;padding:12px"></textarea></div>
   </div>
   <button class="btn primary" style="width:100%" type="submit" id="submitPartner"></button>
   <div class="success" id="partnerSuccess"></div>
   <div class="error" id="partnerError"></div>
  </form>
 </div>
</div>

<iframe name="hiddenSubmitFrame" id="hiddenSubmitFrame" style="display:none"></iframe>

function setText(id, val){const el=document.getElementById(id); if(el) el.innerHTML=val;}
function setValue(id, val){const el=document.getElementById(id); if(el) el.value=val;}

function init(){
  setText("logo", SITE.logo + '<span>' + SITE.logoAccent + '</span>');
  setText("footerLogo", SITE.logo + '<span>' + SITE.logoAccent + '</span>');
  ["navAbout","navProcess","navPortfolio","navOrder","fAbout","fProcess","fPortfolio","fOrder"].forEach((id,i)=>{
    const v=[SITE.navAbout,SITE.navProcess,SITE.navPortfolio,SITE.navOrder][i%4]; setText(id,v);
  });
  setText("heroBadge",SITE.heroBadge);setText("heroTitle",SITE.heroTitle);setText("heroText",SITE.heroText);
  setText("heroOrderBtn",SITE.heroOrderBtn);setText("heroMoreBtn",SITE.heroMoreBtn);
  setText("stat1Value",SITE.stat1Value);setText("stat1Text",SITE.stat1Text);setText("stat2Value",SITE.stat2Value);setText("stat2Text",SITE.stat2Text);setText("stat3Value",SITE.stat3Value);setText("stat3Text",SITE.stat3Text);
  setText("aboutEyebrow",SITE.aboutEyebrow);setText("aboutTitle",SITE.aboutTitle);setText("aboutText",SITE.aboutText);
  setText("processTitle",SITE.processTitle);setText("processText",SITE.processText);
  setText("calcTitle",SITE.calcTitle);setText("calcSub",SITE.calcSub);setText("waterLabel",SITE.waterLabel);setText("labelLabel",SITE.labelLabel);setText("countLabel",SITE.countLabel);setText("totalText",SITE.totalText);setText("orderBtn",SITE.orderBtn);
  setText("portfolioTitle",SITE.portfolioTitle);setText("portfolioText",SITE.portfolioText);setText("portfolioDriveBtn",SITE.portfolioDriveBtn);
  setText("ctaTitle",SITE.ctaTitle);setText("ctaText",SITE.ctaText);setText("partnerBtn",SITE.partnerBtn);
  setText("footerText",SITE.footerText);setText("footerNavTitle",SITE.footerNavTitle);setText("copyright",SITE.copyright);setText("rights",SITE.rights);
  setText("footerPhone",SITE.footerPhone);setText("footerEmail",SITE.footerEmail);setText("footerCity",SITE.footerCity);setText("footerHours",SITE.footerHours);
  document.getElementById("footerPhone").href="tel:"+String(SITE.footerPhone).replace(/[^0-9+]/g,"");
  document.getElementById("footerEmail").href="mailto:"+SITE.footerEmail;
  setText("orderFormTitle",SITE.orderFormTitle);setText("orderFormSub",SITE.orderFormSub);setText("nameLabel",SITE.nameLabel);setText("phoneLabel",SITE.phoneLabel);setText("emailLabel",SITE.emailLabel);setText("cityLabel",SITE.cityLabel);setText("quantityLabel",SITE.quantityLabel);setText("paymentLabel",SITE.paymentLabel);setText("paymentNote",SITE.paymentNote);setText("submitOrder",SITE.submitOrder);
  setText("partnerFormTitle",SITE.partnerFormTitle);setText("partnerFormSub",SITE.partnerFormSub);setText("pNameLabel",SITE.pNameLabel);setText("pPhoneLabel",SITE.pPhoneLabel);setText("pEmailLabel",SITE.pEmailLabel);setText("pCompanyLabel",SITE.pCompanyLabel);setText("pMessageLabel",SITE.pMessageLabel);setText("submitPartner",SITE.submitPartner);

  document.getElementById("heroImage").src=SITE.images.hero;
  document.getElementById("bottleImage").src=SITE.images.bottle;

  const features=document.getElementById("features");
  SITE.features.forEach(x=>features.insertAdjacentHTML("beforeend",`<div class="card"><div class="icon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`));

  const steps=document.getElementById("steps");
  SITE.steps.forEach(x=>steps.insertAdjacentHTML("beforeend",`<div class="step"><div class="num">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`));

  const water=document.getElementById("water");
  SITE.waterOptions.forEach((x,i)=>water.insertAdjacentHTML("beforeend",`<option value="${i}">${x[0]}</option>`));
  const label=document.getElementById("labelType");
  SITE.labelOptions.forEach((x,i)=>label.insertAdjacentHTML("beforeend",`<option value="${i}">${x[0]}</option>`));

  const gallery=document.getElementById("gallery");
  SITE.portfolio.forEach((x,i)=>gallery.insertAdjacentHTML("beforeend",`<div class="galleryCard"><img src="${SITE.images['card'+(i+1)]}" alt="${x[0]}"><div><b>${x[0]}</b><small>${x[1]}</small></div></div>`));

  const pills=document.getElementById("pills"); SITE.pills.forEach(x=>pills.insertAdjacentHTML("beforeend",`<span class="pill">${x}</span>`));

  const po=document.getElementById("paymentOptions");
  SITE.paymentOptions.forEach((x,i)=>po.insertAdjacentHTML("beforeend",`<label class="payOption ${i===0?'active':''}"><input type="radio" name="payPick" value="${x[0]}" ${i===0?'checked':''}>${x[1]}</label>`));
  document.querySelectorAll('input[name="payPick"]').forEach(r=>r.addEventListener("change",()=>{document.querySelectorAll(".payOption").forEach(el=>el.classList.remove("active")); r.parentElement.classList.add("active"); document.getElementById("payment").value=r.value;}));
  document.getElementById("payment").value=SITE.paymentOptions[0][0];

  recalc();
}

function goToSection(id){
  const el=document.getElementById(id);
  if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
  const m=document.getElementById("mainMenu");
  if(m && window.innerWidth<=850){m.style.display="none";m.dataset.open="0";}
}
function openPortfolioDrive(){
  const url=SITE.portfolioDriveUrl;
  if(url && !url.includes("ТВОЙ_ID")) window.open(url,"_blank","noopener,noreferrer");
}
function openSocial(which){
  const url=which==="instagram"?SITE.instagramUrl:SITE.facebookUrl;
  if(url) window.open(url,"_blank","noopener,noreferrer");
}
function recalc(){
  const q=Math.max(SITE.minQuantity, parseInt(document.getElementById("count").value||500,10));
  document.getElementById("count").value=Math.round(q/SITE.quantityStep)*SITE.quantityStep;
  const total=q*(Number(SITE.waterOptions[document.getElementById("water").value][1])+Number(SITE.labelOptions[document.getElementById("labelType").value][1]));
  document.getElementById("price").textContent="₴"+total.toLocaleString("uk-UA");
  return total;
}
function openOrder(){
  document.getElementById("formQuantity").value=document.getElementById("count").value;
  document.getElementById("formWater").value=SITE.waterOptions[document.getElementById("water").value][0];
  document.getElementById("formLabel").value=SITE.labelOptions[document.getElementById("labelType").value][0];
  document.getElementById("formTotal").value=document.getElementById("price").textContent;
  document.getElementById("orderSuccess").style.display="none";
  document.getElementById("orderError").style.display="none";
  document.getElementById("orderModal").classList.add("show");
}
function openPartner(){
  document.getElementById("partnerSuccess").style.display="none";
  document.getElementById("partnerError").style.display="none";
  document.getElementById("partnerModal").classList.add("show");
}
function closeModal(id){document.getElementById(id).classList.remove("show");}

function showSuccessToast(message){
  let toast=document.getElementById("wpSuccessToast");
  if(!toast){
    toast=document.createElement("div");
    toast.id="wpSuccessToast";
    toast.style.cssText="position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:99999;background:#17191c;color:#fff;padding:22px 28px;border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.35);font-size:18px;font-weight:700;text-align:center;max-width:90vw;";
    document.body.appendChild(toast);
  }
  toast.textContent=message;
  toast.style.display="block";
  clearTimeout(window.__wpToastTimer);
  window.__wpToastTimer=setTimeout(()=>{toast.style.display="none"},3000);
}
function submitViaHiddenFrame(form, successEl, errorEl){
  successEl.style.display="none"; errorEl.style.display="none";
  if(!SITE.backendUrl || SITE.backendUrl.includes("PASTE_YOUR_")){
    errorEl.textContent=SITE.errorText; errorEl.style.display="block"; return;
  }
  form.target="hiddenSubmitFrame";
  form.action=SITE.backendUrl;
  form.method="POST";
  form.submit();
  setTimeout(()=>{ form.reset(); closeModal(form.id === "orderForm" ? "orderModal" : "partnerModal"); successEl.style.display="none"; showSuccessToast(form.id === "orderForm" ? "Заказ успешно оформлен! 🎉" : "Заявка на партнёрство успешно отправлена! 🤝"); },900);
}

document.getElementById("heroOrderBtn").onclick=openOrder;
document.getElementById("orderBtn").onclick=openOrder;
document.getElementById("partnerBtn").onclick=openPartner;
document.getElementById("heroMoreBtn").onclick=()=>goToSection("process");
document.getElementById("minus").onclick=()=>{document.getElementById("count").value=Math.max(SITE.minQuantity,parseInt(document.getElementById("count").value||500,10)-SITE.quantityStep);recalc();};
document.getElementById("plus").onclick=()=>{document.getElementById("count").value=parseInt(document.getElementById("count").value||500,10)+SITE.quantityStep;recalc();};
document.getElementById("count").oninput=recalc;
document.getElementById("water").onchange=recalc;
document.getElementById("labelType").onchange=recalc;
document.getElementById("orderForm").onsubmit=e=>{e.preventDefault();document.getElementById("formQuantity").value=document.getElementById("count").value;document.getElementById("formWater").value=SITE.waterOptions[document.getElementById("water").value][0];document.getElementById("formLabel").value=SITE.labelOptions[document.getElementById("labelType").value][0];document.getElementById("formTotal").value=document.getElementById("price").textContent;submitViaHiddenFrame(e.target,document.getElementById("orderSuccess"),document.getElementById("orderError"));};
document.getElementById("partnerForm").onsubmit=e=>{e.preventDefault();submitViaHiddenFrame(e.target,document.getElementById("partnerSuccess"),document.getElementById("partnerError"));};
document.getElementById("burger").onclick=()=>{const m=document.getElementById("mainMenu");const open=m.dataset.open==="1";if(open){m.style.display="none";m.dataset.open="0"}else{m.style.display="flex";m.style.position="absolute";m.style.top="68px";m.style.left="0";m.style.right="0";m.style.padding="16px";m.style.background="#17191c";m.style.flexDirection="column";m.dataset.open="1"}};
document.getElementById("hiddenSubmitFrame").onload=()=>{};


async function loadRemoteConfig(){
  const url = SITE.backendUrl;
  if(!url || url.includes("PASTE_YOUR_")){
    init();
    return;
  }
  let done = false;
  const finish = (cfg)=>{
    if(done) return;
    done = true;
    if(cfg && typeof cfg === "object"){
      Object.keys(cfg).forEach(k=>{
        if(cfg[k] === undefined) return;
        if(k === "images" && cfg.images && typeof cfg.images === "object"){
          SITE.images = Object.assign({}, SITE.images, cfg.images);
        } else {
          SITE[k] = cfg[k];
        }
      });
    }
    init();
  };
  const cb = "__wp_cfg_" + Date.now();
  window[cb] = function(cfg){ finish(cfg); try{delete window[cb]}catch(e){} };
  const s = document.createElement("script");
  s.src = url + (url.includes("?") ? "&" : "?") + "action=config&callback=" + cb;
  s.onerror = ()=>finish(null);
  document.head.appendChild(s);
  setTimeout(()=>finish(null),3500);
}

loadRemoteConfig();
</script>
